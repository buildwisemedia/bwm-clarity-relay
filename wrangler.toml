name = "bwm-clarity-relay"
main = "src/index.ts"
compatibility_date = "2025-03-20"
account_id = "ba00448499190431e6e4a00820f2200d"

[vars]
SUPABASE_URL = "https://lscifhwmmkjiobnthlak.supabase.co"
CLARITY_PROJECT_ID = "w7ga9q22fa"
# BROKER_URL kept for legacy/reference but not used at runtime.
# Mint calls go via service binding env.BROKER (see [[services]] below).
BROKER_URL = "https://bwm-cred-broker.robert-ba0.workers.dev"

# Service binding — required for same-account Worker→Worker mint calls.
# Direct fetch to https://bwm-cred-broker.robert-ba0.workers.dev returns CF
# error 1042. See ~/.claude/.../memory/feedback_cf_worker_subrequest_1042.md.
[[services]]
binding = "BROKER"
service = "bwm-cred-broker"

# [triggers] cron RETIRED 2026-06-02 — bwm-analytics-relay is the successor and
# already covers buildwise-media Clarity. Two schedulers against the same Clarity
# project (w7ga9q22fa) double-counted to ~16 calls/day vs the 10/day cap -> daily
# 429 "Exceeded daily limit". This worker stays deployed (manual POST /run-now still
# works) but no longer self-schedules. Re-enable a cron only if analytics-relay
# stops covering BWM Clarity.

[observability]
enabled = true
